<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MusicUz — Sevimli qo'shiqlaringizni tinglang</title>
  <meta name="description" content="MusicUz — o'zbekcha musiqa platformasi. Qo'shiqlarni qidiring, tinglang, layk bosing va saqlang." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="enhance.css" />
</head>
<body>
  <div class="bg-blob b1"></div><div class="bg-blob b2"></div>

  <aside class="sidebar glass">
    <a href="#/" class="logo">🎧 <span>Music</span>Uz</a>
    <nav>
      <a href="#/" id="nav-home" data-route="">🏠 Bosh sahifa</a>
      <a href="#/profile" id="nav-profile" data-route="profile">👤 Shaxsiy panel</a>
      <a href="#/donate" id="nav-donate" data-route="donate">💜 Donat</a>
      <a href="#/admin" id="nav-admin" data-route="admin" class="hidden">🛠 Admin panel</a>
    </nav>
    <div id="user-box" class="user-box"></div>
  </aside>

  <main id="view" class="main"></main>

  <footer class="player glass" id="player">
    <div class="p-info">
      <div class="cover sm" id="p-cover"></div>
      <div><div id="p-title" class="p-title">Qo'shiq tanlang</div><div id="p-artist" class="muted">—</div></div>
    </div>
    <div class="p-center">
      <div class="p-btns">
        <button id="btn-prev" class="icon-btn" aria-label="Oldingi">⏮</button>
        <button id="btn-play" class="play-btn" aria-label="Ijro">▶</button>
        <button id="btn-next" class="icon-btn" aria-label="Keyingi">⏭</button>
      </div>
      <div class="p-progress">
        <span id="p-cur">0:00</span>
        <input type="range" id="p-seek" min="0" max="100" value="0" />
        <span id="p-dur">0:00</span>
      </div>
    </div>
    <div class="p-right">
      🔊 <input type="range" id="p-vol" min="0" max="1" step="0.01" value="0.8" />
    </div>
    <audio id="audio" preload="none"></audio>
  </footer>

  <div id="toast" class="toast"></div>
  <script src="app.js"></script>
</body>
</html>
